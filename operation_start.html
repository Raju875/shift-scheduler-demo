<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operation Start|Guardvision Monitoring BD Ltd</title>
    <link href="./css/library/bootstrap-5.3.1.css" rel="stylesheet"/>
    <link href="./css/library/select2-4.1.0.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="./js/library/bootstrap-5.3.1.js"></script>
    <script type="text/javascript" src="./js/library/select2-4.1.0.min.js"></script>
    <script type="text/javascript" src="./js/library/sweetalert2-11.7.27.min.js"></script>
    <script type="text/javascript" src="./js/library/airtable.js"></script>
    <style>
      table {
        border-radius: 5px;
        overflow: hidden;
      }
      /* .table td {
        text-align: center;   
      } */
      .form-label:after {
        content:" *";
        color:red;
      }
    </style>
  </head>

  <body>
    <div class="py-5 container">
      <!-- Content here -->
      <div class="container-fluid">
      
        <!-- modal -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert" id="modal" style="display: none;">
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form id="operation_form" autocomplete="off">
          <div class="card border-success">
            <div class="card-header" style="background-color: #139d5d; color: white">
              <div class="clearfix">
                <span class="float-start">Shift operation</span>
                <button type="button" id="show_employee_list" class="btn btn-light float-end" data-bs-toggle="modal" data-bs-target="#monitoring_info_modal">
                  <i class="fa-solid fa-list"></i>
                  Show list
                </button>
              </div>
            </div>
              <div class="card-body">

                <div class="card border-success">
                  <div class="card-body">
                    <div class="row g-3">
                      <div class="col-md-3">
                        <label for="shift" class="form-label">Shift</label>
                        <select id="shift" class="form-select">
                          <option></option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label for="schedule" class="form-label">Schedule</label>
                        <select id="schedule" class="form-select"></select>
                      </div>
                      <div class="col-md-3">
                        <label for="floater" class="form-label">Number of floters</label>
                        <select id="number_of_floater" class="form-select">
                          <option>1</option>
                          <option>2</option>
                        </select>
                      </div>
                    </div>
                    <br>
                    <div class="row g-3" id="custom_schedule_div">
                      <div class="col-md-3">
                        <label for="custom_day" class="form-label">Custom day</label>
                        <select id="custom_day" class="form-select">
                          <option value="Saturday">Saturday</option>
                          <option value="Sunday">Sunday</option>
                          <option value="Monday">Monday</option>
                          <option value="Tuesday">Tuesday</option>
                          <option value="Wednesday">Wednesday</option>
                          <option value="Thursday">Thursday</option>
                          <option value="Friday">Friday</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label for="custom_schedule" class="form-label">Custom schedule</label>
                        <select id="custom_schedule" class="form-select">
                        </select>
                      </div>
                      <div class="col-md-3">
                        <label for="custom_schedule_reason" class="form-label">Reason</label>
                        <select id="custom_schedule_reason" class="form-select">
                          <option value="24 hours holiday monitoring" selected>24 hours holiday monitoring</option>
                          <option value="Client's special request">Client's special request</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="supervisor_div" class="mt-5 mb-4">

                  <div class="card border-success">
                    <div class="card-header" style="background-color: #139d5d; color: white">Supervisor</div>
                    <div class="card-body">

                      <!-- loading div -->
                      <div id="loading_div" class="position-absolute top-50 start-50 translate-middle z-1">
                        <img src="./images/loading.gif" width="200" height="200">
                      </div>

                      <div class="row" id="shift_supervisor_div">
                        <div class="col-md-6 offset-md-3 mb-4">
                          <select id="shift_supervisor" class="form-select" onchange="selectShiftSupervisor()">
                          </select>
                          <div id="error_shift_supervisor"></div>
                        </div>
                        <div class="col-md-1">
                          <span data-toggle="tooltip" data-placement="top" title="This filed will only be active for selecting Shift D or E">
                            <i class="fa fa-info-circle" aria-hidden="true"></i>
                          </span>
                        </div>
                      </div>

                      <table class="table table-striped table-hover table-condensed">
                        <thead>
                          <tr>
                            <td>
                              Name
                            </td>
                            <td>
                              Proxy Details
                            </td>
                          </tr>
                        </thead>
                        <tbody id="supervisor_infos"></tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <div id="operator_div" class="mt-5 mb-4">
                  <div class="card border-success">
                    <div class="card-header" style="background-color: #139d5d; color: white">Operator</div>
                    <div class="card-body">

                      <div class="row" id="shift_operator_div">
                        <div class="col-md-6 offset-md-3 mb-4">
                          <select id="shift_operator" class="form-select" multiple="multiple" onchange="selectShiftOperators()">
                            <option></option>
                          </select>
                          <div id="error_shift_operator"></div>
                        </div>
                        <div class="col-md-1">
                          <span data-toggle="tooltip" id="shift_operator_tooltip" data-placement="top">
                            <i class="fa fa-info-circle" aria-hidden="true"></i>
                          </span>
                        </div>
                      </div>

                      <table class="table table-striped table-hover">
                        <thead>
                          <tr>
                            <td>
                              Name
                            </td>
                            <td>
                              Proxy Details
                            </td>
                          </tr>
                        </thead>
                        <tbody id="operator_infos"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
            
                <div class="card-footer bg-transparent border-success clearfix">
                  <button type="button" class="btn btn-outline-danger float-start" id="close_btn">
                    <i class="fa fa-refresh" aria-hidden="true"></i>
                    Refresh
                  </button>
                  <button type="submit" class="btn btn-outline-success float-end" disabled id="submit_btn">
                    <span id="submit_btn_send_icon"><i class="fas fa-chevron-circle-right" aria-hidden="true"></i></span>
                    <span id="submit_btn_spinner_icon" class="d-none"><i class="fa fa-spinner" aria-hidden="true"></i></span>
                    Submit
                  </button>
                </div>
            </div>
          </div>

        </form>
      </div>
    </div>


    <!-- Modal employee list -->
    <div class="modal fade" id="monitoring_info_modal" tabindex="-1" aria-labelledby="monitoring_info_label" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="monitoring_info_label">
              <i class='fa fa-camera'></i> Monitoring info
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            
            <!-- loading div -->
            <div id="loading_div_modal" class="position-absolute top-50 start-50 translate-middle z-1">
              <img src="./images/loading.gif" width="200" height="200">
            </div>

            <nav>
              <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link" id="supervisor_tab" data-bs-toggle="tab" data-bs-target="#nav-supervisor" type="button" role="tab" aria-controls="nav-supervisor" aria-selected="true">Supervisor</button>
                <button class="nav-link active" id="operator_tab" data-bs-toggle="tab" data-bs-target="#nav-operator" type="button" role="tab" aria-controls="nav-operator" aria-selected="false">Operator</button>
                <button class="nav-link" id="shift_tab" data-bs-toggle="tab" data-bs-target="#nav-shift" type="button" role="tab" aria-controls="nav-shift" aria-selected="false">Shift</button>
                <button class="nav-link" id="shift_type_tab" data-bs-toggle="tab" data-bs-target="#nav-shift-type" type="button" role="tab" aria-controls="nav-shift-type" aria-selected="false">Shift type</button>
              </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
              <!-- Supervisor list on tab -->
              <div class="tab-pane fade" id="nav-supervisor" role="tabpanel" aria-labelledby="supervisor_tab">
                <br>
                <div id="modal_supervisor_div">
                  <table class="table table-bordered table-striped table-hover">
                    <thead>
                      <tr>
                        <td style="background-color: #4a7e66; color: white; width: 10%;">SL</td>
                        <td style="background-color: #4a7e66; color: white; width: 10%;">ID</th>
                        <td style="background-color: #4a7e66; color: white; width: 10%;">Shift</td>
                        <td style="background-color: #4a7e66; color: white; width: 35%;">Name</td>
                        <td style="background-color: #4a7e66; color: white; width: 35%">Designation</td>
                      </tr>
                    </thead>
                    <tbody id="modal_supervisor_list"></tbody>
                  </table>
                </div>
              </div>

              <!-- Operator list on tab -->
              <div class="tab-pane fade show active" id="nav-operator" role="tabpanel" aria-labelledby="operator_tab">
                 <br>
                <div id="modal_operator_div">
                  <table class="table table-bordered table-striped table-hover">
                    <thead>
                      <tr>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">SL</td>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">ID</td>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">Shift</td>
                        <td style="background-color: #4a7e66; color: white; ">Name</td>
                      </tr>
                    </thead>
                    <tbody id="modal_operator_list"></tbody>
                  </table>
                </div>
              </div>

              <!-- Shift info list on tab -->
              <div class="tab-pane fade show" id="nav-shift" role="tabpanel" aria-labelledby="shift_tab">
                <br>
                <div id="modal_shift_div">
                  <table class="table table-bordered table-striped table-hover">
                    <thead>
                      <tr>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">Name</td>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">Team size</td>
                        <td style="background-color: #4a7e66; color: white; width: 20%;">Supervisor</td>
                        <td style="background-color: #4a7e66; color: white; width: 20%;">Operatrors</td>
                        <td style="background-color: #4a7e66; color: white; width: 30%;">Default schedule</td>
                      </tr>
                    </thead>
                    <tbody id="modal_shift_list"></tbody>
                  </table>
                </div>
              </div>

              <!-- Shift Type list on tab -->
              <div class="tab-pane fade show" id="nav-shift-type" role="tabpanel" aria-labelledby="shift_type_tab">
                <br>
                <div id="modal_shift_type_div">
                  <table class="table table-bordered table-striped table-hover">
                    <thead>
                      <tr>
                        <td style="background-color: #4a7e66; color: white; width: 20%;">Name</td>
                        <td style="background-color: #4a7e66; color: white; width: 10%;">DST?</td>
                        <td style="background-color: #4a7e66; color: white; width: 20%;">Start time (BD)</td>
                        <td style="background-color: #4a7e66; color: white; width: 20%;">End time (BD)</td>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">Duration</td>
                        <td style="background-color: #4a7e66; color: white; width: 15%;">Assign shift</td>
                      </tr>
                    </thead>
                    <tbody id="modal_shift_type_list"></tbody>
                  </table>
                </div>
              </div>

            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
              <i class="fa fa-times" aria-hidden="true"></i> Close</button>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="./js/modules/api_aritable.js"></script>
    <script type="text/javascript" src="./js/modules/content.js"></script>
    <script type="text/javascript" src="./js/modules/timepicker.js"></script>
    <script type="text/javascript" src="./js/modules/mix.js"></script>
    <script type="text/javascript" src="./js/main.js"></script>
  </body>
</html>
